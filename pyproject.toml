[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-harness"
version = "0.1.0"
description = "autoagent + autoevals framework for production agents"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "pyyaml",
    "tau2",
]

[project.optional-dependencies]
# The optimization service (harness_service/). Install with:
#     pip install -e ".[service]"
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "requests>=2.31",
]
# No Docker on your machine? An embedded Postgres for local dev — no system
# install, no daemon, lives entirely inside the venv. See scripts/dev_postgres.py.
dev = [
    "pgserver>=0.1.4",
]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench.git", rev = "73dc24445d28762075e69465d966aee4a9dcbfcb" }

# Explicit packaging: the repo is flat-layout with several top-level scripts plus
# the `agent` and `harness_service` packages. Pin them so adding harness_service
# doesn't trip setuptools' multi-package auto-discovery.
[tool.setuptools]
py-modules = ["benchmark", "gating", "prepare", "record"]

[tool.setuptools.packages.find]
include = ["agent*", "harness_service*"]
