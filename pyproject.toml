[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-harness"
version = "0.1.0"
description = "autoagent + autoevals framework for production agents"
requires-python = ">=3.12"
dependencies = [
    "cursor-sdk",
    "e2b",
    "fastapi",
    "openai",
    "pyyaml",
    "uvicorn[standard]",
]
