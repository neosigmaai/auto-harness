  <script>
    const spec = {"openapi": "3.1.0", "info": {"title": "Auto-Harness Optimization Service", "description": "Backend service that runs the TerminalBench agent against a task subset, observes failures,\nand (optimize mode) uses an LLM to iteratively improve the agent \u2014 proposing a new `agent.py`,\nrunning it in an isolated **E2B sandbox**, and keeping the change only if it beats the best\nscore seen so far.\n\n**Auth:** all `/v1` endpoints require an `X-API-Key` header (seeded dev key: `dev-key`).\n\n**Job lifecycle:** `POST /v1/jobs` returns immediately with a `queued` job; a background worker\nclaims it, runs it, and persists the full, lossless iteration history (agent source, per-task\nrewards + traces, the LLM's proposal request/response). Poll `GET /v1/jobs/{id}` until the\nstatus is terminal, then read `GET /v1/jobs/{id}/iterations` for the complete trajectory.\n", "version": "0.1.0"}, "paths": {"/health": {"get": {"tags": ["health"], "summary": "Liveness + DB/worker readiness", "operationId": "health_health_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HealthResponse"}}}}}}}, "/v1/jobs": {"post": {"tags": ["jobs"], "summary": "Submit a benchmark/optimize job (returns immediately)", "operationId": "submit_job_v1_jobs_post", "parameters": [{"name": "X-API-Key", "in": "header", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "X-Api-Key"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/JobCreate"}}}}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/JobRead"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "get": {"tags": ["jobs"], "summary": "List jobs in your org", "operationId": "  "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}}, "components": {"schemas": {"ExecutorKind": {"type": "string", "enum": ["simulated", "harbor"], "title": "ExecutorKind"}, "HTTPValidationError": {"properties": {"detail": {"items": {"$ref": "#/components/schemas/ValidationError"}, "type": "array", "title": "Detail"}}, "type": "object", "title": "HTTPValidationError"}, "HealthResponse": {"properties": {"status": {"type": "string", "title": "Status", "default": "ok"}, "version": {"type": "string", "title": "Version", "default": "0.1.0"}, "db": {"type": "string", "title": "Db"}, "worker_enabled": {"type": "boolean", "title": "Worker Enabled"}}, "type": "object", "required": ["db", "worker_enabled"], "title": "HealthResponse"}, "IterationDecision": {"type": "string", "enum": ["baseline", "accepted", "rejected", "error"], "title": "IterationDecision"}, "IterationRead": {"properties": {"idx": {"type": "integer", "title": "Idx"}, "decision": {"$ref": "#/components/schemas/IterationDecision"}, "decision_reason": {"type": "string", "title": "Decision Reason"}, "val_score": {"type": "number", "title": "Val Score"}, "n_passed": {"type": "integer", "title": "N Passed"}, "n_failed": {"type": "integer", "title": "N Failed"}, "agent_hash": {"type": "string", "title": "Agent Hash"}, "agent_params": {"additionalProperties": true, "type": "object", "title": "Agent Params"}, "proposer": {"anyOf": [{"$ref": "#/components/schemas/ProposerKind"}, {"type": "null"}]}, "proposal_rationale": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Proposal Rationale"}, "proposal_diff": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Proposal Diff"}, "created_at": {"type": "string", "format": "date-time", "title": "Created At"}, "task_results": {"items": {"$ref": "#/components/schemas/TaskResultRead"}, "type": "array", "title": "Task Results", "default": []}, "agent_source": {"anyOf" ": {"type": "integer", "title": "N Passed"}, "n_failed": {"type": "integer", "title": "N Failed"}, "passed_tasks": {"items": {"type": "string"}, "type": "array", "title": "Passed Tasks"}, "failed_tasks": {"items": {"type": "string"}, "type": "array", "title": "Failed Tasks"}, "failures": {"items": {"additionalProperties": true, "type": "object"}, "type": "array", "title": "Failures"}}, "type": "object", "required": ["val_score", "n_passed", "n_failed", "passed_tasks", "failed_tasks", "failures"], "title": "JobSummary", "description": "Structured result of the best iteration (M1 = the baseline iteration)."}, "ProposerKind": {"type": "string", "enum": ["openai", "mock"], "title": "ProposerKind"}, "TaskResultRead": {"properties": {"task_id": {"type": "string", "title": "Task Id"}, "reward": {"anyOf": [{"type": "number"}, {"type": "null"}], "title": "Reward"}, "passed": {"type": "boolean", "title": "Passed"}, "duration_s": {"anyOf": [{"type": "number"}, {"type": "null"}], "title": "Duration S"}, "failure_reason": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Failure Reason"}, "trace_excerpt": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Trace Excerpt"}}, "type": "object", "required": ["task_id", "reward", "passed"], "title": "TaskResultRead"}, "ValidationError": {"properties": {"loc": {"items": {"anyOf": [{"type": "string"}, {"type": "integer"}]}, "type": "array", "title": "Location"}, "msg": {"type": "string", "title": "Message"}, "type": {"type": "string", "title": "Error Type"}, "input": {"title": "Input"}, "ctx": {"type": "object", "title": "Context"}}, "type": "object", "required": ["loc", "msg", "type"], "title": "ValidationError"}}}};
