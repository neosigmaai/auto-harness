services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8800}:8800"
    environment:
      - WORKER_BASE_URL=http://worker:8810
    depends_on:
      - worker

  worker:
    build: .
    command: ["python", "-m", "uvicorn", "worker.server:app", "--host", "0.0.0.0", "--port", "8810"]
    env_file: .env
    environment:
      - AGENT_MODEL=${AGENT_MODEL:-gpt-5.4}
      - CURSOR_AGENT_MODEL=${CURSOR_AGENT_MODEL:-composer-2.5}
    expose:
      - "8810"
    volumes:
      # Mount all editable files so changes take effect without rebuilding
      - ./agent:/app/agent
      - ./workspace:/app/workspace
      - ./experiment_config.yaml:/app/experiment_config.yaml
      - ./benchmark.py:/app/benchmark.py
      - ./gating.py:/app/gating.py
      - ./prepare.py:/app/prepare.py
      - ./record.py:/app/record.py
